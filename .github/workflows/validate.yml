name: validate

on:
  pull_request:
    paths:
      - "catalog/**"
      - "pipeline/**"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - "catalog/**"
      - "pipeline/**"

# Checks only — schema validation and lint. Never writes to the repo.
# pull_request runs can come from external contributors, so least privilege.
permissions:
  contents: read

env:
  # Opt into Node.js 24 ahead of the 2026-09-16 deprecation of Node 20.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: validate full catalog
        run: onexus-agents-validate

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: ruff
        run: ruff check pipeline

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: pip-audit (Python deps)
        run: |
          python -m pip install --upgrade pip pip-audit
          pip install -e .
          pip-audit --strict --desc
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - name: pnpm audit (site deps)
        working-directory: site
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --prod
