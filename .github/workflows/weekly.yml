name: weekly

on:
  schedule:
    # 17:00 UTC every Sunday. Nightly is scheduled for 13:00 UTC but GitHub
    # Actions cron is best-effort and can fire 1-2 hours late under load
    # (today's nightly fired at 14:50). Combined with the 120-min job
    # timeout, nightly can complete as late as ~17:00 UTC in the worst case.
    # 17:00 gives a 4-hour nominal buffer; the rebase-before-push guard in
    # both workflows handles any residual race.
    - cron: "0 17 * * 0"
  workflow_dispatch:
    inputs:
      enrich_limit:
        description: "Max entries to fully enrich with Tier 2 metrics (0 disables)."
        required: false
        default: "500"
      skip_runnable:
        description: "Skip the runnable rescan pass."
        required: false
        default: "false"
      dry_run:
        description: "Compute everything; commit nothing."
        required: false
        default: "false"

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  # Opt into Node.js 24 ahead of the 2026-09-16 deprecation of Node 20.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  rescan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: run weekly rescan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.enrich_limit }}" ]; then
            ARGS="$ARGS --enrich-limit ${{ github.event.inputs.enrich_limit }}"
          fi
          if [ "${{ github.event.inputs.skip_runnable }}" = "true" ]; then
            ARGS="$ARGS --skip-runnable"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          onexus-agents-weekly $ARGS

      - name: validate refreshed catalog
        run: onexus-agents-validate

      - name: open auto-merge PR with rescan results
        if: github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "onexus-agents-bot"
          git config user.email "bot@agents.onexus.dev"

          if [ -z "$(git status --porcelain catalog/)" ]; then
            echo "nothing changed"
            exit 0
          fi

          DATE=$(date -u +%Y-%m-%d)
          BRANCH="bot/weekly-rescan-$DATE"

          git checkout -B "$BRANCH"
          git add catalog/
          git commit -m "chore(catalog): weekly rescan $DATE"

          # Rebase onto fresh main in case the nightly merged during this run
          # (caused #75 to close as CONFLICTING on 2026-06-07, losing the
          # entire weekly's worth of runnable flips + Tier 2 enrichment).
          git fetch origin main
          git rebase origin/main || {
            git rebase --abort
            echo "rebase failed — concurrent merge to main produced a real conflict"
            exit 1
          }

          git push -fu origin "$BRANCH"

          OPEN_PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$OPEN_PR" ]; then
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore(catalog): weekly rescan $DATE" \
              --body "Automated weekly rescan from \`onexus-agents-weekly\`. Re-runs runnable detection on every entry (with README-aware MCP signals) and enriches the staleset 500 entries with Tier 2 metrics."
          fi

          for i in $(seq 1 24); do
            STATE=$(gh pr view "$BRANCH" --json mergeStateStatus --jq '.mergeStateStatus')
            if [ "$STATE" != "UNKNOWN" ]; then
              echo "merge state ready: $STATE"
              break
            fi
            echo "waiting for checks to register (attempt $i, state=$STATE)..."
            sleep 5
          done

          gh pr merge "$BRANCH" --squash --auto

      - name: verify PR actually merged (closes silent-failure gap)
        if: github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          BRANCH="bot/weekly-rescan-$DATE"
          # Poll for up to 10 minutes for the auto-merge to land. If the PR
          # ends up CLOSED without merging — exactly what happened to #75 on
          # 2026-06-07 when the weekly raced with the nightly — fail the job
          # so the failure auto-issue from #70 fires.
          for i in $(seq 1 60); do
            STATE=$(gh pr view "$BRANCH" --json state --jq '.state' 2>/dev/null || echo MISSING)
            case "$STATE" in
              MERGED)
                echo "PR merged successfully"
                exit 0
                ;;
              CLOSED)
                echo "PR was CLOSED without merging — likely conflict during concurrent merge"
                exit 1
                ;;
              MISSING)
                echo "PR no longer queryable — treating as missed"
                exit 1
                ;;
            esac
            echo "attempt $i: state=$STATE, waiting..."
            sleep 10
          done
          echo "10 minutes elapsed and PR is still $STATE — auto-merge blocked"
          exit 1

      - name: cleanup merged branch (best effort)
        if: github.event.inputs.dry_run != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          BRANCH="bot/weekly-rescan-$DATE"
          sleep 30
          git push origin --delete "$BRANCH" || echo "branch already gone or rate-limited"

      - name: open failure issue (only on workflow failure)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          EXISTING=$(gh issue list --state open --label bot-failure --json number --jq '.[0].number // empty')
          BODY=$(cat <<EOF
          The \`weekly\` rescan workflow failed.

          - Run: $RUN_URL
          - Date (UTC): $DATE
          - Event: ${{ github.event_name }}
          - Commit: ${{ github.sha }}

          Likely culprits: GH API budget exhausted during 5-call/agent enrich,
          OpenAI billing, GH_PAT expired, classifier overspend during the
          runnable rescan README fetches.
          EOF
          )
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create \
              --title "weekly failure $DATE" \
              --label "bot-failure" \
              --body "$BODY"
          fi
