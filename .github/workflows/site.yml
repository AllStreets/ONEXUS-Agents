name: site

on:
  pull_request:
    paths:
      - "site/**"
      - "catalog/**"
  push:
    branches: [main]
    paths:
      - "site/**"
      - "catalog/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - name: install
        run: pnpm install --frozen-lockfile
      - name: typecheck
        run: pnpm check
      - name: build
        run: pnpm build
