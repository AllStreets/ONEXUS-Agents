name: site

on:
  pull_request:
    paths:
      - "site/**"
      - "catalog/**"
  push:
    branches: [main]
    paths:
      - "site/**"
      - "catalog/**"

# Build-only workflow; never needs to write to the repo. Pull_request runs
# can be triggered by external contributors, so pin to least privilege.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - name: install
        run: pnpm install --frozen-lockfile
      - name: typecheck
        run: pnpm check
      - name: build
        run: pnpm build
