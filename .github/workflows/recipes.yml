name: recipes

# Weekly: resolve an install recipe for every runnable catalog agent from its repository
# and package registry, then verify the new or changed ones by building each in a
# confined container and asking it for its tools over MCP. Unchanged recipes keep their
# last result. The changes arrive as a PR, like the nightly catalog refresh.

on:
  schedule:
    - cron: "0 18 * * 0"   # Sundays, after the weekly rescan
  workflow_dispatch:
    inputs:
      limit:
        description: "verify at most this many recipes"
        default: "150"

permissions:
  contents: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  recipes:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: resolve
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: onexus-agents-recipes resolve
      - name: verify new and changed recipes
        run: onexus-agents-recipes verify --jobs 3 --limit "${{ github.event.inputs.limit || '150' }}"
      - name: summary
        run: onexus-agents-recipes summary | tee -a "$GITHUB_STEP_SUMMARY"
      - name: open PR with the recipes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "onexus-agents-bot"
          git config user.email "bot@agents.onexus.dev"
          if [ -z "$(git status --porcelain recipes/)" ]; then echo "nothing changed"; exit 0; fi
          DATE=$(date -u +%Y-%m-%d)
          BRANCH="bot/recipes-$DATE"
          git checkout -B "$BRANCH"
          git add recipes/
          git commit -m "chore(recipes): weekly resolve and verify $DATE"
          git push -fu origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "chore(recipes): weekly resolve and verify $DATE" \
              --body "Automated weekly run of \`onexus-agents-recipes\`. Verification built each new or changed recipe in a confined container and asked it for its tools over MCP. See recipes/_summary.json."
          fi
