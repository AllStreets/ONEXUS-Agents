name: nightly

on:
  schedule:
    # 13:00 UTC every day (8 AM EST / 9 AM EDT)
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      seeds_only:
        description: "Skip auto-discovery and refresh seeds only"
        required: false
        default: "false"
      dry_run:
        description: "Compute everything; commit nothing"
        required: false
        default: "false"

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Pre-classifier (PR #58), full runs took ~35-55 min. The classifier
    # adds real network roundtrips that pushed the last run past 60 min and
    # killed it. 120 min gives headroom; budget caps and CLASSIFIER_MAX_PER_RUN
    # prevent runaway spend from filling that headroom.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: run nightly refresh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: a fine-grained PAT with public_repo:read raises GH's
          # rate window from 1000/hr → 5000/hr. Falls back to GITHUB_TOKEN
          # if the secret isn't set.
          GH_PAT: ${{ secrets.GH_PAT }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Fallback if Anthropic fails or is rate-limited. Both providers
          # are optional — keyword classifier handles the easy cases for free.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.seeds_only }}" = "true" ]; then ARGS="$ARGS --seeds-only"; fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          onexus-agents-nightly $ARGS

      - name: validate refreshed catalog
        run: onexus-agents-validate

      - name: open auto-merge PR with refresh
        if: github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "onexus-agents-bot"
          git config user.email "bot@agents.onexus.dev"

          if [ -z "$(git status --porcelain catalog/)" ]; then
            echo "nothing changed"
            exit 0
          fi

          DATE=$(date -u +%Y-%m-%d)
          BRANCH="bot/refresh-$DATE"

          git checkout -B "$BRANCH"
          git add catalog/
          git commit -m "chore(catalog): daily refresh $DATE"
          git push -fu origin "$BRANCH"

          # Reuse an *open* PR for the same date if one already exists (workflow re-run).
          # `gh pr view` matches the most recent PR regardless of state, so a previously
          # merged or closed same-day PR (e.g. an earlier manual run) would suppress the
          # create and leave the new push orphaned. Filter to open PRs only.
          OPEN_PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$OPEN_PR" ]; then
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore(catalog): daily refresh $DATE" \
              --body "Automated daily refresh from \`onexus-agents-nightly\`. Validator passed in the same workflow run before this PR was opened."
          fi

          # `gh pr merge --auto` fails with "unstable status" if it runs before
          # GitHub has registered the PR's required checks. Poll mergeStateStatus
          # until it's no longer UNKNOWN so the auto-merge queue accepts the PR.
          for i in $(seq 1 24); do
            STATE=$(gh pr view "$BRANCH" --json mergeStateStatus --jq '.mergeStateStatus')
            if [ "$STATE" != "UNKNOWN" ]; then
              echo "merge state ready: $STATE"
              break
            fi
            echo "waiting for checks to register (attempt $i, state=$STATE)..."
            sleep 5
          done

          # `--delete-branch` ran inline previously and tripped a 403 rate limit
          # on cleanup AFTER the merge succeeded, painting the whole job red.
          # The branch delete is cosmetic — drop it from the merge call and let
          # the next step handle it best-effort.
          gh pr merge "$BRANCH" --squash --auto

      - name: cleanup merged branch (best effort)
        if: github.event.inputs.dry_run != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          BRANCH="bot/refresh-$DATE"
          # Sleep so auto-merge has a chance to land before we ask GitHub to
          # delete the branch; if it's still ahead of merge, this is a no-op.
          sleep 30
          git push origin --delete "$BRANCH" || echo "branch already gone or rate-limited"
