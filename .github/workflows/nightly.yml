name: nightly

on:
  schedule:
    # 13:00 UTC every day (8 AM EST / 9 AM EDT)
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      seeds_only:
        description: "Skip auto-discovery and refresh seeds only"
        required: false
        default: "false"
      dry_run:
        description: "Compute everything; commit nothing"
        required: false
        default: "false"

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  # Opt into Node.js 24 ahead of the 2026-09-16 deprecation of Node 20.
  # actions/checkout and actions/setup-python both embed Node; until their
  # default major versions ship Node 24 binaries, this env var forces the
  # runtime upgrade on each invocation.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Pre-classifier (PR #58), full runs took ~35-55 min. The classifier
    # adds real network roundtrips that pushed the last run past 60 min and
    # killed it. 120 min gives headroom; budget caps and CLASSIFIER_MAX_PER_RUN
    # prevent runaway spend from filling that headroom.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: run nightly refresh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: a fine-grained PAT with public_repo:read raises GH's
          # rate window from 1000/hr → 5000/hr. Falls back to GITHUB_TOKEN
          # if the secret isn't set.
          GH_PAT: ${{ secrets.GH_PAT }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Fallback if Anthropic fails or is rate-limited. Both providers
          # are optional — keyword classifier handles the easy cases for free.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.seeds_only }}" = "true" ]; then ARGS="$ARGS --seeds-only"; fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          onexus-agents-nightly $ARGS

      - name: validate refreshed catalog
        run: onexus-agents-validate

      - name: cost + budget guard
        # Fails the job if the run blew through a sensible budget envelope.
        # The thresholds match the documented free-tier story: classifier
        # call total should stay under CLASSIFIER_MAX_PER_RUN (#64) and GH
        # API budget should never reach zero.
        run: |
          python - <<'PY'
          import json, sys
          s = json.load(open("_run_stats.json"))
          print(json.dumps(s, indent=2))
          calls = s["classifier_ok"] + s["classifier_err"]
          if calls > 2200:
              sys.exit(f"classifier overspend: {calls} > 2200 (cap is 2000)")
          if s["budget_remaining_gh"] <= 0:
              sys.exit("GH API budget exhausted — raise ONEXUS_GH_BUDGET or PAT")
          if s["budget_remaining_hf"] <= 0:
              sys.exit("HF API budget exhausted — raise ONEXUS_HF_BUDGET")
          PY

      - name: open auto-merge PR with refresh
        if: github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "onexus-agents-bot"
          git config user.email "bot@agents.onexus.dev"

          if [ -z "$(git status --porcelain catalog/ reports/)" ]; then
            echo "nothing changed"
            exit 0
          fi

          DATE=$(date -u +%Y-%m-%d)
          BRANCH="bot/refresh-$DATE"

          git checkout -B "$BRANCH"
          git add catalog/ reports/
          git commit -m "chore(catalog): daily refresh $DATE"

          # Rebase onto fresh main in case anything merged during this run
          # (e.g. weekly rescan or a submission auto-PR). Without this, the
          # branch's base is stale and the PR becomes CONFLICTING/DIRTY,
          # silently closing instead of merging. If the rebase itself
          # conflicts, fail loud — the failure-issue step will open a ticket.
          git fetch origin main
          git rebase origin/main || {
            git rebase --abort
            echo "rebase failed — concurrent merge to main produced a real conflict"
            exit 1
          }

          git push -fu origin "$BRANCH"

          # Reuse an *open* PR for the same date if one already exists (workflow re-run).
          # `gh pr view` matches the most recent PR regardless of state, so a previously
          # merged or closed same-day PR (e.g. an earlier manual run) would suppress the
          # create and leave the new push orphaned. Filter to open PRs only.
          OPEN_PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$OPEN_PR" ]; then
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore(catalog): daily refresh $DATE" \
              --body "Automated daily refresh from \`onexus-agents-nightly\`. Validator passed in the same workflow run before this PR was opened."
          fi

          # `gh pr merge --auto` fails with "unstable status" if it runs before
          # GitHub has registered the PR's required checks. Poll mergeStateStatus
          # until it's no longer UNKNOWN so the auto-merge queue accepts the PR.
          for i in $(seq 1 24); do
            STATE=$(gh pr view "$BRANCH" --json mergeStateStatus --jq '.mergeStateStatus')
            if [ "$STATE" != "UNKNOWN" ]; then
              echo "merge state ready: $STATE"
              break
            fi
            echo "waiting for checks to register (attempt $i, state=$STATE)..."
            sleep 5
          done

          # `--delete-branch` ran inline previously and tripped a 403 rate limit
          # on cleanup AFTER the merge succeeded, painting the whole job red.
          # The branch delete is cosmetic — drop it from the merge call and let
          # the next step handle it best-effort.
          gh pr merge "$BRANCH" --squash --auto

      - name: verify PR actually merged (closes silent-failure gap)
        if: github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          BRANCH="bot/refresh-$DATE"
          # Poll for up to 10 minutes for the auto-merge to land. A PR that
          # ends up CLOSED-without-merge (e.g. CONFLICTING/DIRTY from a
          # concurrent merge) won't trigger if: failure() because the
          # workflow itself succeeded — only the merge silently lost. This
          # step fails the job in that case, which triggers the failure
          # auto-issue from PR #70.
          for i in $(seq 1 60); do
            STATE=$(gh pr view "$BRANCH" --json state --jq '.state' 2>/dev/null || echo MISSING)
            case "$STATE" in
              MERGED)
                echo "PR merged successfully"
                exit 0
                ;;
              CLOSED)
                echo "PR was CLOSED without merging — likely conflict during concurrent merge"
                exit 1
                ;;
              MISSING)
                echo "PR no longer queryable — treating as missed"
                exit 1
                ;;
            esac
            echo "attempt $i: state=$STATE, waiting..."
            sleep 10
          done
          echo "10 minutes elapsed and PR is still $STATE — auto-merge blocked"
          exit 1

      - name: cleanup merged branch (best effort)
        if: github.event.inputs.dry_run != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          BRANCH="bot/refresh-$DATE"
          # Sleep so auto-merge has a chance to land before we ask GitHub to
          # delete the branch; if it's still ahead of merge, this is a no-op.
          sleep 30
          git push origin --delete "$BRANCH" || echo "branch already gone or rate-limited"

      - name: open failure issue (only on workflow failure)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          # Reuse an existing open bot-failure issue rather than spamming.
          EXISTING=$(gh issue list --state open --label bot-failure --json number --jq '.[0].number // empty')
          BODY=$(cat <<EOF
          The \`nightly\` workflow failed.

          - Run: $RUN_URL
          - Date (UTC): $DATE
          - Event: ${{ github.event_name }}
          - Commit: ${{ github.sha }}

          Likely culprits: GH/HF API outage, OpenAI billing, GH_PAT expired,
          job timeout, classifier overspend, validator caught a bad entry.

          The cost-guard step inside the workflow prints the run-stats JSON
          before failing — open the run log and search for "classifier_ok"
          to see the budget snapshot.
          EOF
          )
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create \
              --title "nightly failure $DATE" \
              --label "bot-failure" \
              --body "$BODY"
          fi
