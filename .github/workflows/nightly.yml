name: nightly

on:
  schedule:
    # 13:00 UTC every day (8 AM EST / 9 AM EDT)
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      seeds_only:
        description: "Skip auto-discovery and refresh seeds only"
        required: false
        default: "false"
      dry_run:
        description: "Compute everything; commit nothing"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: run nightly refresh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.seeds_only }}" = "true" ]; then ARGS="$ARGS --seeds-only"; fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          onexus-agents-nightly $ARGS

      - name: validate refreshed catalog
        run: onexus-agents-validate

      - name: commit and push
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "onexus-agents-bot"
          git config user.email "bot@agents.onexus.dev"
          if [ -n "$(git status --porcelain catalog/)" ]; then
            git add catalog/
            git commit -m "chore(catalog): nightly refresh $(date -u +%Y-%m-%d)"
            git push
          else
            echo "nothing changed"
          fi
