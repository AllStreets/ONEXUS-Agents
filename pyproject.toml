[project]
name = "onexus-agents-pipeline"
version = "0.1.0"
description = "Ingestion, ranking, and validation pipeline for the ONEXUS-Agents catalog."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "AllStreets" }]

dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "tenacity>=8.5",
  "click>=8.1",
  "openai>=1.50",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.5",
]

[project.scripts]
onexus-agents-nightly = "pipeline.nightly:main"
onexus-agents-validate = "validator.validate_submission:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pipeline*", "validator*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
